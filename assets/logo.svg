<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="goldGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D080"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9E7831"/>
    </linearGradient>
  </defs>
  <rect width="400" height="100" fill="#141210"/>
  <!-- Central crest/emblem -->
  <g transform="translate(40, 20)">
    <rect width="60" height="60" rx="10" fill="none" stroke="url(#goldGradL)" stroke-width="1.2"/>
    <circle cx="30" cy="30" r="24" fill="none" stroke="url(#goldGradL)" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.7"/>
    <text x="30" y="42" font-family="'Playfair Display', serif" font-size="34" font-weight="700" text-anchor="middle" fill="url(#goldGradL)">A</text>
  </g>
  <!-- Brand text -->
  <text x="120" y="52" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="url(#goldGradL)" letter-spacing="4">ALABASTRO</text>
  <text x="122" y="72" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500" fill="#E8D5B5" letter-spacing="6" opacity="0.9">ALTA PERFUMERÍA · COLOMBIA</text>
</svg>
